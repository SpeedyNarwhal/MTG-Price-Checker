[project]
name = "mtg-price-checker"
version = "0.1.1"
description = "Magic: The Gathering card price checker (CLI + desktop app)."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "httpx",
]
browser = [
    "playwright>=1.40.0",
]
cloudflare = [
    "curl-cffi>=0.7.0",
]
desktop = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pywebview>=5.0",
    "python-multipart>=0.0.9",
    "winotify>=1.1.0",
]
packaging = [
    "pyinstaller>=6.0",
    "mtg-price-checker[desktop,browser]",
]

[project.scripts]
mtg-prices = "mtg_price_checker.cli:main"
mtg-prices-app = "mtg_price_checker.desktop.launcher:main"
mtg-prices-server = "mtg_price_checker.app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]