[project]
name = "mtg-price-checker"
version = "0.1.0"
description = "Terminal-based Magic: The Gathering card price checker."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
browser = [
    "playwright>=1.40.0",
]

[project.scripts]
mtg-prices = "mtg_price_checker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]